services:
  uc-rotate:
    image: spark-delta-unitycatalog/spark:4.2.0
    container_name: uc-rotate
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./uc-conf:/uc-conf
      - ./scripts:/scripts:ro
    command:
      - bash
      - -c
      - |
        cp -n /uc-conf/server.properties.orig /uc-conf/server.properties
        python3 /scripts/rotate_uc_sts.py \
          --minio-endpoint http://minio:9000 \
          --config /uc-conf/server.properties \
          --no-restart

  unitycatalog:
    # UC publishes server images only for minor releases, so there is no v0.5.1
    # image to pair with the 0.5.1 jars in spark/Dockerfile. Built from source
    # instead -- see unitycatalog/Dockerfile.
    build:
      context: ./unitycatalog
      args:
        UC_TAG: v0.5.1
    image: unitycatalog:v0.5.1
    container_name: unitycatalog
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/api/2.1/unity-catalog/catalogs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      uc-rotate:
        condition: service_completed_successfully
      # UC's s3.bucketPath.0 is s3://warehouse, so the bucket must exist before
      # the server starts -- otherwise this races minio-setup on a fresh volume.
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - ./metadata/uc:/tmp/uc
      - ./uc-conf:/home/unitycatalog/etc/conf
    networks:
      default:
        aliases:
          - server

  ui:
    # The unitycatalog/unitycatalog-ui repo was archived 2024-09-02 and merged into
    # unitycatalog/unitycatalog under ui/. Its Docker Hub image is abandoned too --
    # last push 2025-05-23, predating v0.3.0. Build from the tagged source instead,
    # matching upstream's own compose.yaml. PROXY_HOST is baked into package.json's
    # proxy field at build time and must match the server's network alias below.
    build:
      context: "https://github.com/unitycatalog/unitycatalog.git#v0.5.1:ui"
      args:
        PROXY_HOST: server
    image: unitycatalog-ui:0.5.1
    container_name: unitycatalog-ui
    ports:
      - "3000:3000"
    depends_on:
      unitycatalog:
        condition: service_healthy

  minio:
    # Built from source: the last MinIO community image on Docker Hub is
    # RELEASE.2025-09-07T16-13-09Z, which predates the GHSA-jjjj-jwhf-8rgr fix
    # (privilege escalation via session policy bypass in service accounts and
    # STS). Upstream shipped that fix in RELEASE.2025-10-15T17-29-55Z but never
    # published an image for it. See minio/Dockerfile.
    build:
      context: ./minio
      args:
        MINIO_TAG: RELEASE.2025-10-15T17-29-55Z
    image: minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - ./metadata/minio:/data
    networks:
      default:
        aliases:
          - s3

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    # -e so a failed alias/mb aborts the container instead of reporting success;
    # --ignore-existing keeps re-runs clean against a persisted ./metadata/minio.
    # No sleep needed -- depends_on already waits for minio's healthcheck.
    entrypoint:
      - /bin/sh
      - -euc
      - |
        mc alias set myminio http://minio:9000 admin password
        mc mb --ignore-existing myminio/warehouse
        mc stat myminio/warehouse > /dev/null

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster_password
      POSTGRES_DB: dagster
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./metadata/postgres:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - db

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: spark-delta-unitycatalog/spark:4.2.0
    container_name: spark
    user: "0:0"
    depends_on:
      unitycatalog:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["bash", "-lc", "/opt/spark/sbin/start-connect-server.sh && sleep infinity"]
    environment:
      - SPARK_DAEMON_JAVA_OPTS=--add-modules jdk.incubator.vector
    ports:
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
      - "15002:15002"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('127.0.0.1', 15002)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./metadata/uc:/tmp/uc
      - ./metadata/ivy:/tmp/.ivy2
      - ./metadata/spark-events:/tmp/spark-events
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./scripts:/opt/spark/scripts:ro
      - ./workspace:/workspace

  spark-history:
    image: spark-delta-unitycatalog/spark:4.2.0
    container_name: spark-history
    user: "0:0"
    depends_on:
      spark:
        condition: service_healthy
    command: ["bash", "-lc", "/opt/spark/sbin/start-history-server.sh && tail -f /dev/null"]
    ports:
      - "18080:18080"
    environment:
      - SPARK_DAEMON_JAVA_OPTS=--add-modules jdk.incubator.vector
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:/tmp/spark-events
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('127.0.0.1', 18080)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./metadata/spark-events:/tmp/spark-events

  dagster-user-code:
    image: spark-delta-unitycatalog/spark:4.2.0
    container_name: dagster-user-code
    user: "0:0"
    depends_on:
      spark:
        condition: service_healthy
      postgres:
        condition: service_healthy
    working_dir: /workspace/dagster
    command: ["bash", "-lc", "dagster code-server start -h 0.0.0.0 -p 4000 -m dagster_workspace.definitions"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "dagster api grpc-health-check -p 4000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - DAGSTER_HOME=/workspace/dagster
      - DAGSTER_CURRENT_IMAGE=spark-delta-unitycatalog/spark:4.2.0
    volumes:
      - ./metadata/uc:/tmp/uc
      - ./metadata/ivy:/tmp/.ivy2
      - ./metadata/spark-events:/tmp/spark-events
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./scripts:/opt/spark/scripts:ro
      - ./workspace:/workspace

  dagster-webserver:
    image: spark-delta-unitycatalog/spark:4.2.0
    container_name: dagster-webserver
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      dagster-user-code:
        condition: service_healthy
    working_dir: /workspace/dagster
    command: ["bash", "-lc", "dagster-webserver -h 0.0.0.0 -p 3001 -w /workspace/dagster/workspace.yaml"]
    restart: always
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('127.0.0.1', 3001)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      - DAGSTER_HOME=/workspace/dagster
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  dagster-daemon:
    image: spark-delta-unitycatalog/spark:4.2.0
    container_name: dagster-daemon
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      dagster-user-code:
        condition: service_healthy
    working_dir: /workspace/dagster
    command: ["bash", "-lc", "dagster-daemon run"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dagster-daemon || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - DAGSTER_HOME=/workspace/dagster
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
